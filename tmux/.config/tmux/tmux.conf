# ---
# label: CONFIG
# role: tmux config for the M1 (prefix C-a, vim-aware nav, Catppuccin palette) plus the
#   Claude Code layer: waiting flags, the cbg popup (prefix + a), agent view with vim nav
#   mode (prefix + A, Esc), and a scratch shell popup (prefix + t).
# invariants:
#   - The waiting flags come from hooks in ~/.claude/settings.json, which is machine-local
#     (see "Claude attention flag").
#   - Esc is bound in the root table. Panes not running agent view get it straight through
#     via a format test, with no shell run.
# gotchas:
#   - agents-esc.sh and agents-open.sh find agent view by the pane title it sets
#     ("... claude agents"), and agents-esc.sh also reads its footer text. A Claude Code
#     update that changes either degrades them to plain Esc / a second agent view.
# last-touched: 2026-11-22
# ---
# tmux.conf — M1 Mac + Neovim + iTerm2

# --- Prefix: Ctrl+A ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Reload config ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# --- General ---
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g bell-action none
set -g set-titles on
set -g set-titles-string "#T - tmux"
setw -g automatic-rename on

# --- Terminal / color ---
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc"

# NOTE: the Claude Code tmux-rendering workaround lives in zsh/.zsh/tmux.zsh
# (CLAUDE_CODE_DISABLE_ALTERNATE_SCREEN, $TMUX-gated). It was moved out of here
# because `set-environment -g` only seeds newly-spawned panes and never reaches
# an already-running shell, so reload + in-place restart appeared to do nothing.
# The prior CLAUDE_CODE_ALT_SCREEN_FULL_REPAINT line was removed: it targets the
# Windows ConPTY coalescing bug, a different class, and had no effect here.

# Instant escape — critical for Neovim responsiveness
set -sg escape-time 10

# Scope keyboard enhancement modes (Kitty protocol / modifyOtherKeys) per-pane.
# `on` enables extended keys only when an inner program (Neovim) requests them
# via `\e[>4;1m`, and tmux 3.3+ correctly resets state on pane switch — so the
# Neovim-state-bleeds-across-panes bug that originally pushed this to `always`
# is no longer a concern. `always` left CSI-u sequences active in zsh, where
# Shift+Enter / Shift+Space (`\e[13;2u`, `\e[32;2u`) get inserted as literal
# `;2u` junk at the prompt.
set -g extended-keys on

# Advertise that the OUTER terminal can RECEIVE extended keys. `extended-keys`
# above only governs what tmux forwards INWARD to the pane; without this feature
# flag tmux never negotiates CSI-u with the terminal in the first place, so
# modified keys that have no ASCII control code — Shift+Enter, Ctrl+/ — collapse
# to their unmodified form before any application sees them. Both are required;
# either one alone is a no-op. Symptom: Shift+Enter submits in Claude Code
# instead of inserting a newline, even in iTerm2, which supports it natively.
#
# xterm*  — iTerm2, kitty (xterm-kitty), Ghostty (xterm-ghostty), most others.
# tmux*/screen* — only relevant if a tmux ever runs INSIDE an ssh pane of
#   another tmux: the outer one exports TERM=tmux-256color into its panes, so
#   the inner one sees a client termname xterm* will never match and extended
#   keys die at the inner layer. Prefer not nesting (dedicated terminal -> ssh
#   -> remote tmux); these two lines just make it degrade gracefully if you do.
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'tmux*:extkeys'
set -as terminal-features 'screen*:extkeys'

# Let inner programs' escape sequences reach the outer terminal instead of being
# swallowed by tmux. Required for Claude Code's desktop notifications and
# progress bar to survive the tmux layer. Distinct from the Sync@ terminal-
# override experiments (ff2a3b1) — that was synchronized output (DECSET 2026),
# this is OSC passthrough. If pane rendering regresses, this is a suspect.
set -g allow-passthrough on

# Register iTerm2 bracketed paste capability — xterm-256color terminfo on macOS
# lacks smBP/rmBP entries, so tmux can't detect it from terminfo alone.
set -sa terminal-overrides ',xterm-256color:smBP=\e[?2004h:rmBP=\e[?2004l'

# --- Vim-aware pane navigation (vim-tmux-navigator) ---
# When Neovim is active: C-h/j/k/l pass through to Neovim
# (handles both pane nav AND completion C-j/C-k inside Neovim)
# When anything else is active: tmux switches panes
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# --- Splits (inherit cwd) ---
# Active-pane splits (split only the current pane)
bind '-' split-window -v    -c "#{pane_current_path}"
bind '\' split-window -h    -c "#{pane_current_path}"
# Full-window splits (-f spans the full window width/height)
bind '_' split-window -v -f -c "#{pane_current_path}"
bind '|' split-window -h -f -c "#{pane_current_path}"

# New windows also inherit cwd
bind c new-window -c "#{pane_current_path}"

# --- Resize panes: Alt + arrow ---
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up    resize-pane -U 5
bind -n M-Down  resize-pane -D 5

# --- Resize panes: prefix + h/j/k/l (Meta-free alternative to Alt+arrow) ---
# Completes the hjkl triad: C-hjkl = navigate, prefix+hjkl = resize,
# prefix+Shift+HJKL = move. -r lets you tap h/j/k/l again within repeat-time.
# NOTE: overrides tmux's default `prefix l` = last-window (use prefix p/n/w).
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# --- Move panes (restructure layout): prefix + Shift+H/J/K/L ---
# Relocates the current pane past its neighbor in the given direction, using
# tmux's directional pane-target tokens ({left-of}/{right-of}/{up-of}/{down-of})
# so no shell/id-capture is needed. join-pane detaches the current pane and
# re-splits the target: -h = side-by-side, -v = stacked; -b lands it before
# (left/above) instead of after (right/below). -r allows chaining nudges.
# If there's no pane in that direction, join-pane no-ops with a status message.
bind -r H join-pane -h -b -t '{left-of}'   # move left  — src left of left neighbor
bind -r L join-pane -h    -t '{right-of}'  # move right — src right of right neighbor
bind -r K join-pane -v -b -t '{up-of}'     # move up    — src above up neighbor
bind -r J join-pane -v    -t '{down-of}'   # move down  — src below down neighbor

# Diagonal moves: stack the current pane against a horizontal neighbor.
# Keys mirror the keyboard's corners around the H/J/K/L home row —
#   Y U  (upper row → above)      Y=above-left   U=above-right
#   B N  (lower row → below)      B=below-left   N=below-right
# All use -v (stacked); -b lands it above (Y/U) vs below (B/N); the target
# token picks the left ({left-of}) vs right ({right-of}) neighbor.
bind -r Y join-pane -v -b -t '{left-of}'   # above-left
bind -r U join-pane -v -b -t '{right-of}'  # above-right
bind -r B join-pane -v    -t '{left-of}'   # below-left
bind -r N join-pane -v    -t '{right-of}'  # below-right (was the standalone B)

# --- Peek at keybindings: prefix + ? → fuzzy fzf popup (Telescope-style) ---
# Overrides the default list-keys pager with an fzf popup. Type to filter by
# key or command (e.g. "join", "resize", "copy"). Enter/Esc closes; read-only.
# -E closes the popup when fzf exits. Requires fzf on PATH.
bind ? display-popup -E -w 80% -h 80% \
  "tmux list-keys | sed -E 's/^bind-key +//' | fzf --reverse --prompt 'tmux keys> '"

# --- Copy mode (vi) ---
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Cross-platform clipboard: pbcopy on macOS, xclip on Linux X11/XWayland
if-shell 'command -v pbcopy >/dev/null 2>&1' \
    'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
    'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"'

# --- System clipboard integration (OSC 52) ---
# Lets inner programs (Neovim, less, etc.) write to the OUTER terminal's
# clipboard via the OSC 52 escape sequence. Without this, tmux silently
# drops OSC 52 from inner programs and yank-inside-nvim-inside-tmux only
# reaches the system clipboard if nvim's auto-detected pbcopy/xclip
# provider happens to work — which is brittle (re-attached sessions,
# stripped PATH, macOS pasteboard detachment).
#
# Terminal must also honor OSC 52: iTerm2, kitty, WezTerm, Ghostty,
# alacritty all do. Apple Terminal.app does NOT — switch terminals or
# yanks-from-nvim won't reach the Mac clipboard.
set -g set-clipboard on

# Advertise the clipboard capability so OSC 52 payloads aren't truncated
# at the legacy ~74-byte limit.
set -as terminal-features ',*:clipboard'

# Paste from system clipboard (mirrors copy direction of `y` above).
# Default `prefix ]` pastes the last tmux buffer; this overrides to
# pull straight from the OS clipboard so cross-app paste is one keystroke.
if-shell 'command -v pbpaste >/dev/null 2>&1' \
    'bind ] run-shell "pbpaste | tmux load-buffer - && tmux paste-buffer"' \
    'bind ] run-shell "xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer"'

# --- Palette (Catppuccin Mocha) ---
# Soft pastels on a dark base; no pure white text and no saturated backgrounds,
# which halo badly with astigmatism at night. Plain style options take the hex
# values directly; format strings read them from these @c_* options.
set -g @c_mantle   '#181825'
set -g @c_base     '#1e1e2e'
set -g @c_surface0 '#313244'
set -g @c_surface1 '#45475a'
set -g @c_overlay0 '#6c7086'
set -g @c_overlay1 '#7f849c'
set -g @c_subtext  '#a6adc8'
set -g @c_text     '#cdd6f4'
set -g @c_blue     '#89b4fa'
set -g @c_green    '#a6e3a1'
set -g @c_peach    '#fab387'

# --- Status bar ---
set -g status on
set -g status-style bg=#181825,fg=#a6adc8
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#[fg=#{@c_green}] #S #[default] "
# "N waiting" summary across every session, shown only when N > 0.
set -g status-right "#{?#{==:#{client_key_table},agentnav},#[fg=#{@c_green}]AGENT NAV  #[default],}#{?#{n:#{S:#{W:#{P:#{@claude_wait}}}}},#[fg=#{@c_peach}]#{n:#{S:#{W:#{P:#{@claude_wait}}}}} waiting  #[default],}#[fg=#{@c_overlay1}]%Y-%m-%d %H:%M  #h "

setw -g window-status-style bg=#181825,fg=#7f849c
setw -g window-status-current-style bg=#313244,fg=#cdd6f4
setw -g window-status-separator ''

# --- Claude attention flag ---
# Claude Code hooks in ~/.claude/settings.json set the pane option @claude_wait=1
# on Notification/Stop (needs you) and unset it on UserPromptSubmit/PostToolUse.
# A window with any waiting pane gets peach text (the selected window keeps its
# raised background); the pane's border label does the same, and
# status-right counts them. Unnamed windows fall back to the active pane's
# directory; name a window with prefix + , and it stays fixed.
#
# The hooks are NOT in this repo: ~/.claude/settings.json is machine-local, so
# a new host needs this block merged into its "hooks" key by hand:
#   SET='[ -n "$TMUX_PANE" ] && tmux set-option -p -t "$TMUX_PANE" @claude_wait 1 2>/dev/null; exit 0'
#   CLR='[ -n "$TMUX_PANE" ] && tmux set-option -p -u -t "$TMUX_PANE" @claude_wait 2>/dev/null; exit 0'
#   "Notification":     [{ "hooks": [{ "type": "command", "command": SET }] }]
#   "Stop":             [{ "hooks": [{ "type": "command", "command": SET }] }]
#   "UserPromptSubmit": [{ "hooks": [{ "type": "command", "command": CLR }] }]
#   "PostToolUse":      [{ "matcher": "*", "hooks": [{ "type": "command", "command": CLR }] }]
# Needs tmux 3.2+ for the #{P:} pane loops; with no hooks nothing ever flags.
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g status-interval 5
# A waiting window also shows how many of its panes are waiting: "3 MusicPortfolio 2".
setw -g window-status-format '#{?#{m:*1*,#{P:#{@claude_wait}}},#[fg=#{@c_peach}] #I #W #{n:#{P:#{@claude_wait}}}, #I #W}#F '
setw -g window-status-current-format '#{?#{m:*1*,#{P:#{@claude_wait}}},#[fg=#{@c_peach}] #I #W #{n:#{P:#{@claude_wait}}}, #I #W}#F '
# prefix + W: tree of only the panes waiting on you; Enter jumps there.
bind W choose-tree -Z -f '#{@claude_wait}'
# prefix + Tab: jump to the next waiting pane in any window, zoomed (prefix + z unzooms).
bind Tab run-shell '~/.config/tmux/claude-next-waiting.sh "#{pane_id}" "#{client_name}"'

# --- Background Claude sessions (agent view) ---
# prefix + a: popup that starts a background session (cbg -i, ~/.local/bin/cbg from the
# zsh package). It opens in this pane's directory; fzf offers the repo's worktrees. The
# popup floats over the layout, so it works with agent view open and closes on exit.
bind a display-popup -E -w 70% -h 50% -d "#{pane_current_path}" '~/.local/bin/cbg -i'
# prefix + A: jump to the pane running agent view, wherever it is and however it was
# started (found by the title agent view sets), or open it in a new "agents" window;
# then turn on agent nav mode (below).
bind A run-shell 'sh ~/.config/tmux/agents-open.sh "#{client_name}" "#{pane_current_path}"'

# --- Agent nav mode: vim keys for agent view ---
# Agent view moves between rows only with the arrow keys, and keybindings.json has
# no row actions to rebind, so this key table turns vim keys into the keys agent
# view knows. The status bar shows AGENT NAV while it's on.
#   j/k rows  J/K reorder  g/G first/last  C-d/C-u page  Space peek  p pin  x stop
#   (x twice deletes)  l or Enter attach  r rename  / find  i or q leave  Esc stays
# Keys that attach, rename or find leave nav mode so you can type. Any other key
# also leaves it and goes through to agent view, so typing a prompt just works.
# Esc turns it back on when agent view's list is showing, for example after you type a
# prompt or come back from a session with the left arrow; prefix + A works too.
# The list and an opened session share one pane and one title, so agents-esc.sh reads
# the footer to tell them apart. In a session, a dialog, or anything it doesn't
# recognise, Esc goes to Claude unchanged. Panes not running agent view (matched by
# the title it sets, "N awaiting input · claude agents") get Esc directly, with no
# shell run (if-shell -F is a format test).
bind -n Escape if-shell -F '#{m:*claude agents,#{pane_title}}' {
  run-shell 'sh ~/.config/tmux/agents-esc.sh "#{pane_id}" "#{client_name}"'
} {
  send-keys Escape
}
bind -T agentnav j      send-keys Down   \; switch-client -T agentnav
bind -T agentnav k      send-keys Up     \; switch-client -T agentnav
bind -T agentnav J      send-keys S-Down \; switch-client -T agentnav
bind -T agentnav K      send-keys S-Up   \; switch-client -T agentnav
bind -T agentnav g      send-keys Home   \; switch-client -T agentnav
bind -T agentnav G      send-keys End    \; switch-client -T agentnav
bind -T agentnav C-d    send-keys NPage  \; switch-client -T agentnav
bind -T agentnav C-u    send-keys PPage  \; switch-client -T agentnav
bind -T agentnav Space  send-keys Space  \; switch-client -T agentnav
bind -T agentnav p      send-keys C-t    \; switch-client -T agentnav
bind -T agentnav x      send-keys C-x    \; switch-client -T agentnav
bind -T agentnav l      send-keys Right
bind -T agentnav Enter  send-keys Enter
bind -T agentnav r      send-keys C-r
bind -T agentnav /      send-keys C-f
bind -T agentnav i      switch-client -T root
bind -T agentnav q      switch-client -T root
# Esc stays in nav mode, as in vim normal mode. It isn't passed on: in agent view's
# list, Esc with an empty input exits agent view.
bind -T agentnav Escape switch-client -T agentnav

# --- Scratch terminal ---
# prefix + t: a throwaway shell in a popup, in this pane's directory, for quick
# commands without a split. exit or Ctrl+D closes it. Replaces the default
# prefix + t clock.
bind t display-popup -E -w 80% -h 60% -d "#{pane_current_path}"

# --- Pane borders ---
set -g pane-border-style fg=#45475a
set -g pane-active-border-style fg=#89b4fa
# Label every pane with its title; Claude Code sets it to the session name (/rename).
set -g pane-border-status top
# Waiting panes: whole label in peach. Idle panes: dim grey, a step brighter
# for the focused pane, so the waiting ones stand out in a crowded window.
set -g pane-border-format '#{?#{@claude_wait},#[fg=#{@c_peach}] waiting  #P #{pane_title} ,#[fg=#{?pane_active,#{@c_subtext},#{@c_overlay0}}] #P #{pane_title} }'
