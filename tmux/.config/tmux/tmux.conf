# tmux.conf — M1 Mac + Neovim + iTerm2

# --- Prefix: Ctrl+A ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Reload config ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# --- General ---
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g bell-action none
set -g set-titles on
set -g set-titles-string "#T - tmux"
setw -g automatic-rename on

# --- Terminal / color ---
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc"

# NOTE: the Claude Code tmux-rendering workaround lives in zsh/.zsh/tmux.zsh
# (CLAUDE_CODE_DISABLE_ALTERNATE_SCREEN, $TMUX-gated). It was moved out of here
# because `set-environment -g` only seeds newly-spawned panes and never reaches
# an already-running shell, so reload + in-place restart appeared to do nothing.
# The prior CLAUDE_CODE_ALT_SCREEN_FULL_REPAINT line was removed: it targets the
# Windows ConPTY coalescing bug, a different class, and had no effect here.

# Instant escape — critical for Neovim responsiveness
set -sg escape-time 10

# Scope keyboard enhancement modes (Kitty protocol / modifyOtherKeys) per-pane.
# `on` enables extended keys only when an inner program (Neovim) requests them
# via `\e[>4;1m`, and tmux 3.3+ correctly resets state on pane switch — so the
# Neovim-state-bleeds-across-panes bug that originally pushed this to `always`
# is no longer a concern. `always` left CSI-u sequences active in zsh, where
# Shift+Enter / Shift+Space (`\e[13;2u`, `\e[32;2u`) get inserted as literal
# `;2u` junk at the prompt.
set -g extended-keys on

# Register iTerm2 bracketed paste capability — xterm-256color terminfo on macOS
# lacks smBP/rmBP entries, so tmux can't detect it from terminfo alone.
set -sa terminal-overrides ',xterm-256color:smBP=\e[?2004h:rmBP=\e[?2004l'

# --- Vim-aware pane navigation (vim-tmux-navigator) ---
# When Neovim is active: C-h/j/k/l pass through to Neovim
# (handles both pane nav AND completion C-j/C-k inside Neovim)
# When anything else is active: tmux switches panes
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# --- Splits (inherit cwd) ---
# Active-pane splits (split only the current pane)
bind '-' split-window -v    -c "#{pane_current_path}"
bind '\' split-window -h    -c "#{pane_current_path}"
# Full-window splits (-f spans the full window width/height)
bind '_' split-window -v -f -c "#{pane_current_path}"
bind '|' split-window -h -f -c "#{pane_current_path}"

# New windows also inherit cwd
bind c new-window -c "#{pane_current_path}"

# --- Resize panes: Alt + arrow ---
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up    resize-pane -U 5
bind -n M-Down  resize-pane -D 5

# --- Move panes (restructure layout): prefix + Shift+H/J/K/L ---
# Relocates the current pane past its neighbor in the given direction, using
# tmux's directional pane-target tokens ({left-of}/{right-of}/{up-of}/{down-of})
# so no shell/id-capture is needed. join-pane detaches the current pane and
# re-splits the target: -h = side-by-side, -v = stacked; -b lands it before
# (left/above) instead of after (right/below). -r allows chaining nudges.
# If there's no pane in that direction, join-pane no-ops with a status message.
bind -r H join-pane -h -b -t '{left-of}'   # move left  — src left of left neighbor
bind -r L join-pane -h    -t '{right-of}'  # move right — src right of right neighbor
bind -r K join-pane -v -b -t '{up-of}'     # move up    — src above up neighbor
bind -r J join-pane -v    -t '{down-of}'   # move down  — src below down neighbor

# Diagonal moves: stack the current pane against a horizontal neighbor.
# Keys mirror the keyboard's corners around the H/J/K/L home row —
#   Y U  (upper row → above)      Y=above-left   U=above-right
#   B N  (lower row → below)      B=below-left   N=below-right
# All use -v (stacked); -b lands it above (Y/U) vs below (B/N); the target
# token picks the left ({left-of}) vs right ({right-of}) neighbor.
bind -r Y join-pane -v -b -t '{left-of}'   # above-left
bind -r U join-pane -v -b -t '{right-of}'  # above-right
bind -r B join-pane -v    -t '{left-of}'   # below-left
bind -r N join-pane -v    -t '{right-of}'  # below-right (was the standalone B)

# --- Copy mode (vi) ---
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Cross-platform clipboard: pbcopy on macOS, xclip on Linux X11/XWayland
if-shell 'command -v pbcopy >/dev/null 2>&1' \
    'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
    'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"'

# --- System clipboard integration (OSC 52) ---
# Lets inner programs (Neovim, less, etc.) write to the OUTER terminal's
# clipboard via the OSC 52 escape sequence. Without this, tmux silently
# drops OSC 52 from inner programs and yank-inside-nvim-inside-tmux only
# reaches the system clipboard if nvim's auto-detected pbcopy/xclip
# provider happens to work — which is brittle (re-attached sessions,
# stripped PATH, macOS pasteboard detachment).
#
# Terminal must also honor OSC 52: iTerm2, kitty, WezTerm, Ghostty,
# alacritty all do. Apple Terminal.app does NOT — switch terminals or
# yanks-from-nvim won't reach the Mac clipboard.
set -g set-clipboard on

# Advertise the clipboard capability so OSC 52 payloads aren't truncated
# at the legacy ~74-byte limit.
set -as terminal-features ',*:clipboard'

# Paste from system clipboard (mirrors copy direction of `y` above).
# Default `prefix ]` pastes the last tmux buffer; this overrides to
# pull straight from the OS clipboard so cross-app paste is one keystroke.
if-shell 'command -v pbpaste >/dev/null 2>&1' \
    'bind ] run-shell "pbpaste | tmux load-buffer - && tmux paste-buffer"' \
    'bind ] run-shell "xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer"'

# --- Status bar ---
set -g status on
set -g status-style bg=colour234,fg=colour136
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#[fg=green]#S #[fg=cyan]"
set -g status-right "#[fg=yellow]%Y-%m-%d %H:%M #[fg=green] #h"

setw -g window-status-current-style bg=colour33,fg=colour231
setw -g window-status-style bg=colour235,fg=colour136

# --- Pane borders ---
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour51
